    <rect x="54" y="44" width="20" height="16" rx="3"/>
    <rect x="80" y="44" width="20" height="16" rx="3"/>
    <rect x="28" y="68" width="20" height="16" rx="3"/>
    <rect x="54" y="68" width="20" height="16" rx="3"/>
    <rect x="80" y="68" width="20" height="16" rx="3"/>
  </g>
</svg>

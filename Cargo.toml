[package]
name = "minikeyboard"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native Linux Mini Keyboard programmer (GTK 4 / libadwaita / hidapi)"
authors = ["Quantmind"]
repository = "https://github.com/quantmind/minikeyboard"
readme = "README.md"
default-run = "minikeyboard"

[[bin]]
name = "minikeyboard"
path = "src/main.rs"

[[bin]]
name = "import-vector"
path = "src/bin/import-vector.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5", "gtk_v4_10"] }
hidapi = { version = "2.6.6", default-features = false, features = ["linux-native"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
directories = "6.0.0"
bitflags = { version = "2.13.1", features = ["serde"] }
hex = "0.4.3"
sha2 = "0.10.9"
async-channel = "2.5.0"
tempfile = "3.27.0"
glib = "0.22"
libc = "0.2"

[build-dependencies]
glib-build-tools = "0.22.8"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
